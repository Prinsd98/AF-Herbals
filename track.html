<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AF Herbals — Order Tracking</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px}
.card{background:#1c2333;border:1px solid #30363d;border-radius:16px;width:100%;max-width:480px;overflow:hidden;margin-top:20px;box-shadow:0 8px 32px #00000060}
.header{background:linear-gradient(135deg,#00d4aa20,#00d4aa08);border-bottom:1px solid #30363d;padding:20px 24px;display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;background:linear-gradient(135deg,#00d4aa,#00b894);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.brand{font-size:18px;font-weight:800;color:#00d4aa}
.brand-sub{font-size:11px;color:#8b949e;margin-top:2px}
.body{padding:24px}
.status-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.status-badge{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700}
.status-badge.Delivered{background:#00cba918;color:#00cba9;border:1px solid #00cba930}
.status-badge.Pending{background:#ffa50218;color:#ffa502;border:1px solid #ffa50230}
.status-badge.In-Transit{background:#4a9eff18;color:#4a9eff;border:1px solid #4a9eff30}
.status-badge.Cancelled{background:#ff475718;color:#ff4757;border:1px solid #ff475730}
.order-id{font-size:22px;font-weight:800;color:#e6edf3;margin-bottom:4px}
.order-date{font-size:12px;color:#8b949e}
.section{margin-bottom:18px}
.section-title{font-size:11px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #30363d}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;font-size:13px;border-bottom:1px solid #30363d20}
.row:last-child{border-bottom:none}
.row-label{color:#8b949e;flex-shrink:0;margin-right:12px}
.row-value{font-weight:600;color:#e6edf3;text-align:right}
.amount-row{background:#00d4aa0a;border:1px solid #00d4aa25;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.amount-label{font-size:12px;color:#8b949e}
.amount-value{font-size:22px;font-weight:800;color:#00d4aa}
.payment-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.footer{padding:16px 24px;border-top:1px solid #30363d;text-align:center;font-size:12px;color:#8b949e}
.footer a{color:#00d4aa;text-decoration:none}
.loading{text-align:center;padding:60px 24px;color:#8b949e}
.spinner{width:36px;height:36px;border:3px solid #30363d;border-top-color:#00d4aa;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#ff475715;border:1px solid #ff475740;border-radius:10px;padding:20px;text-align:center;color:#ff4757}
@media(max-width:520px){.card{border-radius:12px}.header{padding:16px 18px}.body{padding:18px}.amount-value{font-size:18px}}
</style>
</head>
<body>
<div style="text-align:center;margin-bottom:4px">
  <div style="font-size:24px">🌿</div>
  <div style="font-size:13px;color:#8b949e;margin-top:4px">AF Herbals — Order Tracking</div>
</div>
<div class="card" id="card">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading your order...</div>
  </div>
</div>
<script>
const SUPA_URL = 'https://cfjnaygmbxqrbbxxpbpo.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmam5heWdtYnhxcmJieHhwYnBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MzQ4NjcsImV4cCI6MjA5MDMxMDg2N30.LPnutFBzRZfiG30q0IZ9QxWbBunF7ALKW0Da71485Mw';

async function loadOrder(id) {
  const res = await fetch(SUPA_URL + '/rest/v1/orders?id=eq.' + encodeURIComponent(id) + '&limit=1', {
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
  });
  if (!res.ok) throw new Error('Failed to load order');
  const data = await res.json();
  if (!data || !data.length) throw new Error('Order not found');
  return data[0];
}

function statusClass(s){ return s ? s.replace(' ','-') : 'Pending'; }

function render(o) {
  const amt = parseFloat(o.amount || 0);
  const payColor = o.payment === 'Paid' ? '#00cba9' : o.payment === 'Cash on Delivery' ? '#ffa502' : '#ff4757';
  document.getElementById('card').innerHTML = `
    <div class="header">
      <div class="logo">🌿</div>
      <div>
        <div class="brand">AF Herbals (Pvt) Ltd</div>
        <div class="brand-sub">Herbal & Natural Products</div>
      </div>
    </div>
    <div class="body">
      <div class="order-id">#${o.id}</div>
      <div class="order-date">${o.date || ''}</div>
      <div class="status-row" style="margin-top:10px">
        <span class="status-badge ${statusClass(o.status)}">${o.status || 'Pending'}</span>
      </div>
      <div class="section">
        <div class="section-title">Recipient Details</div>
        <div class="row"><span class="row-label">Name</span><span class="row-value">${o.recipient || '—'}</span></div>
        <div class="row"><span class="row-label">Address</span><span class="row-value" style="max-width:220px">${o.raddr || '—'}</span></div>
        <div class="row"><span class="row-label">District</span><span class="row-value">${o.to_city || '—'}</span></div>
      </div>
      <div class="section">
        <div class="section-title">Shipment Details</div>
        <div class="row"><span class="row-label">Route</span><span class="row-value">${o.from_city || 'Trincomalee'} → ${o.to_city || '—'}</span></div>
        <div class="row"><span class="row-label">Weight</span><span class="row-value">${o.weight || '—'} kg</span></div>
        <div class="row"><span class="row-label">Service</span><span class="row-value">${o.service || 'Standard'}</span></div>
        <div class="row"><span class="row-label">Description</span><span class="row-value">${o.description || '—'}</span></div>
      </div>
      <div class="amount-row">
        <div>
          <div class="amount-label">Amount</div>
          <div class="amount-value">LKR ${amt.toLocaleString('en-LK', {minimumFractionDigits:2})}</div>
        </div>
        <span class="payment-badge" style="background:${payColor}20;color:${payColor};border:1px solid ${payColor}40">${o.payment || '—'}</span>
      </div>
    </div>
    <div class="footer">
      Sender: AF Herbals (Pvt) Ltd, Trincomalee<br>
      Contact: <a href="tel:0774663542">0774663542</a> | <a href="tel:0762069085">0762069085</a>
    </div>
  `;
}

function renderError(msg) {
  document.getElementById('card').innerHTML = `
    <div class="body">
      <div class="error-box">
        <div style="font-size:32px;margin-bottom:12px">❌</div>
        <div style="font-weight:700;margin-bottom:6px">Order Not Found</div>
        <div style="font-size:13px">${msg}</div>
        <div style="margin-top:14px;font-size:12px;color:#8b949e">Contact AF Herbals: 0774663542</div>
      </div>
    </div>
  `;
}

const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');
if (!orderId) {
  renderError('No order ID provided in the link.');
} else {
  loadOrder(orderId)
    .then(render)
    .catch(e => renderError(e.message));
}
</script>
</body>
</html>
